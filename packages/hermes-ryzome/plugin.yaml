name: ryzome
version: 1.1.0
description: Ryzome canvas and document tools for Hermes Agent
author: 0xPlaygrounds
requires_env:
  - name: RYZOME_API_KEY
    description: "Ryzome API key"
    url: "https://ryzome.ai/workspace#settings/api-keys"
    secret: true
provides_tools:
  - create_ryzome_document
  - create_ryzome_canvas
  - get_ryzome_document
  - get_ryzome_canvas
  - list_ryzome_documents
  - list_ryzome_canvases
  - create_ryzome_plan
  - create_ryzome_research
  - update_ryzome_document
  - save_ryzome_node_to_library
  - upload_ryzome_image
  - update_ryzome_canvas
  - verify_ryzome_structure
  - create_ryzome_bundle
  - get_ryzome_bundle
  - update_ryzome_bundle
  - create_ryzome_conversation
  - get_ryzome_conversation
  - list_ryzome_conversations
  - update_ryzome_conversation
  - add_ryzome_conversation_message
  - search_ryzome_conversations
  - delete_ryzome_conversation
provides_hooks: []
